# Render blueprint: https://render.com/docs/blueprint-spec
#
# Deploy with: push this repo to GitHub, then New > Blueprint in Render.
services:
  - type: web
    name: exam-system
    runtime: docker
    plan: starter          # a disk is required, so this cannot be the free plan
    region: oregon
    healthCheckPath: /api/health

    # MUST stay 1. Presence tracking, admin session tokens and the exam clock
    # all live in this process, and the database is a single SQLite file on the
    # disk below. A second instance would hold a second, diverging copy of the
    # exam - some students submitting into one, some into the other.
    numInstances: 1

    disk:
      name: exam-data
      mountPath: /data     # matches DB_FILE; survives deploys and restarts
      sizeGB: 1

    envVars:
      - key: DB_FILE
        value: /data/exam.db
      - key: PUBLIC_URL
        # Replace with your real Render URL once the service exists, or your own
        # domain. Until this is right, the QR code and Join Info panel will show
        # an address students cannot reach.
        value: https://exam-system.onrender.com
      - key: ADMIN_PASSWORD
        # Render generates a strong value and keeps it out of the repo. Read it
        # from the service's Environment tab.
        generateValue: true
